{% extends 'blog/base.html' %}

{% block title %}Delete Post — The Blog{% endblock %}

{% block extra_css %}
<style>
  .back-link {
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    margin-bottom: 2.5rem;
  }
  .back-link:hover { color: var(--rust); }
  .confirm-box {
    border: 1.5px solid var(--rust);
    padding: 2.5rem;
    max-width: 520px;
  }
  .confirm-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--rust);
    margin-bottom: 1rem;
  }
  .confirm-message {
    color: var(--muted);
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }
  .confirm-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--ink);
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  .confirm-actions { display: flex; gap: 0.75rem; }
</style>
{% endblock %}

{% block content %}
<a href="{% url 'post_detail' post.pk %}" class="back-link">← Back to Post</a>

<div class="confirm-box">
  <h1 class="confirm-heading">Delete Post?</h1>
  <p class="confirm-message">This action is permanent and cannot be undone.</p>
  <p class="confirm-title">"{{ post.title }}"</p>

  <form method="post">
    {% csrf_token %}
    <div class="confirm-actions">
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'post_detail' post.pk %}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
